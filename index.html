<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slipbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e10;
      --surface: #17171a;
      --surface2: #1f1f24;
      --border: #2e2e36;
      --accent: #d4f264;
      --accent2: #6af2b0;
      --text: #e8e8ec;
      --muted: #6b6b7a;
      --red: #ff5c5c;
    }


      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(212,242,100,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,242,100,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .topbar h1 {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--accent);
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .topbar-sub {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-right: auto;
    }

    .layout {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 65px);
    }

    .sidebar {
      width: 320px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header {
      padding: 14px 18px;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .sidebar-header:hover { color: var(--text); }

    .sidebar-header .toggle-arrow {
      font-size: 0.6rem;
      transition: transform 0.15s;
    }

    .sidebar-header.collapsed .toggle-arrow {
      transform: rotate(-90deg);
    }

    .sidebar-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-body.hidden { display: none; }

    .sidebar-body label {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 3px;
      display: block;
    }

    .sidebar-body textarea,
    .sidebar-body input[type="datetime-local"],
    .sidebar-body input[type="date"],
    .sidebar-body input[type="month"],
    .sidebar-body input[type="file"],
    .sidebar-body input[type="text"],
    .sidebar-body select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Instrument Serif', serif;
      font-size: 0.78rem;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }

    .sidebar-body textarea::placeholder,
    .sidebar-body input::placeholder {
      color: var(--muted);
    }

    .sidebar-body textarea:focus,
    .sidebar-body input:focus,
    .sidebar-body select:focus {
      border-color: var(--accent2);
    }

    .sidebar-body textarea {
      min-height: 80px;
      line-height: 1.5;
    }

    .btn-primary {
      background: var(--accent);
      color: #0e0e10;
      border: none;
      font-family: 'Instrument Serif', serif;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
      width: 100%;
    }

    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Instrument Serif', serif;
      font-size: 0.78rem;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
    }

    .btn-secondary:hover {
      border-color: var(--accent2);
      background: rgba(106,242,176,0.05);
    }

    .btn-accent2 {
      background: transparent;
      border: 1px solid var(--accent2);
      color: var(--accent2);
      font-family: 'Instrument Serif', serif;
      font-size: 0.78rem;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      width: 100%;
    }

    .btn-accent2:hover { background: var(--accent2); color: #0e0e10; }

    .hint-text {
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .hint-text.accent { color: var(--accent2); }

    .export-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .input-btn-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .input-btn-row input,
    .input-btn-row select {
      flex: 1;
      min-width: 0;
      width: auto !important;
    }

    .input-btn-row .btn-secondary {
      width: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .shortcuts-hint {
      font-size: 0.65rem;
      color: var(--muted);
    }

    .kbd {
      font-family: 'Instrument Serif', serif;
      font-size: 0.65rem;
      background: var(--surface2);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-bar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-bar span {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .search-bar input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Instrument Serif', serif;
      font-size: 0.8rem;
      padding: 7px 12px;
      border-radius: 20px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input::placeholder { color: var(--muted); }
    .search-bar input:focus { border-color: var(--accent); }

    .note-count-badge {
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.65rem;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .notes-list::-webkit-scrollbar { width: 4px; }
    .notes-list::-webkit-scrollbar-track { background: transparent; }
    .notes-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 60px 24px;
      text-align: center;
    }

    .empty-state p { font-size: 0.78rem; color: var(--muted); line-height: 1.6; }

    details.month-block {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    details.month-block + details.month-block { margin-top: 4px; }

    summary.month-summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      user-select: none;
    }

    summary.month-summary::-webkit-details-marker { display: none; }

    .month-summary-title::before {
      content: "▸";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.12s ease;
      font-size: 0.6rem;
    }

    details[open] > summary .month-summary-title::before {
      transform: rotate(90deg);
    }

    .month-summary-count {
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.62rem;
      border: 1px solid var(--border);
    }

    .month-inner {
      padding: 0 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-top: 1px solid var(--border);
    }

    details.day-block {
      border-radius: 6px;
      padding: 2px 0 4px;
    }

    summary.day-summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
      font-size: 0.72rem;
      color: var(--text);
      user-select: none;
    }

    summary.day-summary::-webkit-details-marker { display: none; }

    .day-summary-title::before {
      content: "▸";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.12s ease;
      font-size: 0.6rem;
      color: var(--muted);
    }

    details.day-block[open] > summary .day-summary-title::before {
      transform: rotate(90deg);
    }

    .day-summary-count {
      font-size: 0.65rem;
      color: var(--muted);
    }

    .day-inner {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
      margin-left: 4px;
    }

    .note {
      padding: 10px 12px;
      border-radius: 7px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s;
    }

    .note:hover { border-color: rgba(106,242,176,0.3); }

    .note-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .note-meta-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .note-meta {
      font-size: 0.65rem;
      color: var(--muted);
    }

    .score-badge {
      font-size: 0.62rem;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface);
    }

    .score-badge.rated {
      border-color: rgba(106,242,176,0.4);
      color: var(--accent2);
    }

    .delete-note-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 2px;
      transition: color 0.15s;
      font-family: 'Instrument Serif', serif;
    }

    .delete-note-btn:hover { color: var(--red); }

    .note-text {
      margin: 0;
      font-size: 0.82rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: var(--text);
      line-height: 1.55;
    }

    .error-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--red);
      color: #fff;
      font-size: 0.78rem;
      padding: 10px 20px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 999;
      font-family: 'Instrument Serif', serif;
    }

    .error-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 700px) {
      .layout { flex-direction: column; height: auto; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>Slipbox</h1>
    <span class="topbar-sub">a minimal inbox for your notes</span>
    <span class="hint-text">stored locally · no account</span>
  </div>

  <div class="layout">

    <div class="sidebar">

      <div class="sidebar-section">
        <div class="sidebar-header" id="newNoteHeader">
          <span>New note</span>
          <span class="toggle-arrow">▾</span>
        </div>
        <div class="sidebar-body" id="newNoteBody">
          <div>
            <label for="noteInput">Note</label>
            <textarea id="noteInput" placeholder="Type anything you'd normally email yourself…"></textarea>
          </div>
          <button class="btn-primary" id="saveButton">Save note</button>
          <div class="shortcuts-hint">
            <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> &nbsp;/&nbsp;
            <span class="kbd">⌘</span> + <span class="kbd">Enter</span>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-header collapsed" id="pastNoteHeader">
          <span>Add past note</span>
          <span class="toggle-arrow">▾</span>
        </div>
        <div class="sidebar-body hidden" id="pastNoteBody">
          <div>
            <label for="pastNoteInput">Note</label>
            <textarea id="pastNoteInput" placeholder="Paste an old note here…"></textarea>
          </div>
          <div>
            <label for="pastNoteTime">Timestamp</label>
            <input id="pastNoteTime" type="datetime-local" />
          </div>
          <button class="btn-primary" id="savePastButton">Save past note</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-header collapsed" id="exportHeader">
          <span>Export &amp; Import</span>
          <span class="toggle-arrow">▾</span>
        </div>
        <div class="sidebar-body hidden" id="exportBody">
          <div class="export-group">
            <button class="btn-accent2" id="exportRankedTxtBtn">Export ranked .txt</button>
            <button class="btn-secondary" id="exportAllBtn">Export all .txt</button>
          </div>

          <div>
            <label>Export by month</label>
            <div class="input-btn-row">
              <input id="exportMonthOnlyInput" type="month" />
              <button class="btn-secondary" id="exportMonthBtn">Export</button>
            </div>
          </div>

          <div>
            <label>Import CSV</label>
            <div style="display:flex;flex-direction:column;gap:7px;">
              <input id="csvInput" type="file" accept=".csv,text/csv" />
              <button class="btn-secondary" id="importCsvBtn">Import CSV</button>
            </div>
          </div>

          <div id="exportHint" class="hint-text"></div>
          <div id="importHint" class="hint-text accent"></div>
        </div>
      </div>

    </div>

    <div class="main">
      <div class="search-bar">
        <span>Notes</span>
        <input id="searchInput" type="text" placeholder="Search…" />
        <span class="note-count-badge" id="noteCountBadge">0 notes</span>
      </div>
      <div id="notesList" class="notes-list"></div>
    </div>

  </div>

  <div class="error-toast" id="errorToast"></div>

  <script>
    (function () {
      const STORAGE_KEY = "slipboxNotes";
      let notes = [];

      const MONTH_NAMES = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
      ];

      function loadNotes() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) { notes = []; return; }
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            notes = parsed.map(n => ({
              id: n.id,
              text: n.text || "",
              createdAt: n.createdAt || new Date().toISOString(),
              relevanceScore: Number.isInteger(n.relevanceScore) ? n.relevanceScore : null
            }));
          } else { notes = []; }
        } catch (err) { notes = []; }
      }

      function saveNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      function createNote(text, createdAtISO) {
        const baseText = (text || "").trim();
        if (!baseText) return;
        let createdDate;
        if (createdAtISO) {
          const parsed = new Date(createdAtISO);
          createdDate = isNaN(parsed.getTime()) ? new Date() : parsed;
        } else {
          createdDate = new Date();
        }
        notes.unshift({
          id: Date.now() + Math.random(),
          text: baseText,
          createdAt: createdDate.toISOString(),
          relevanceScore: null
        });
        saveNotes();
      }

      function deleteNote(noteId) {
        const idx = notes.findIndex(n => String(n.id) === String(noteId));
        if (idx === -1) return;
        notes.splice(idx, 1);
        saveNotes();
      }

      function getRatedNotes() {
        return notes.filter(note => Number.isInteger(note.relevanceScore));
      }

      function getRatedNotesSorted() {
        return getRatedNotes().slice().sort((a, b) => {
          if (b.relevanceScore !== a.relevanceScore) return b.relevanceScore - a.relevanceScore;
          return new Date(b.createdAt) - new Date(a.createdAt);
        });
      }

      function formatTime(isoString) {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      }

      function formatDateTime(isoString) {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }

      function formatGeneratedStamp() {
        const d = new Date();
        return d.toLocaleDateString(undefined, { year: "numeric", month: "2-digit", day: "2-digit" }) + " " +
               d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      }

      function safeFileStamp() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      }

      function downloadTextFile(filename, text) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
      }

      function getMonthKey(d) {
        if (!(d instanceof Date) || isNaN(d.getTime())) return "unknown";
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      }

      function getDayKey(d) {
        if (!(d instanceof Date) || isNaN(d.getTime())) return "unknown";
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      }

      function getMonthLabelFromKey(key) {
        if (key === "unknown") return "Unknown";
        const [y, m] = key.split("-");
        return `${MONTH_NAMES[parseInt(m,10)-1] || "Unknown"} ${y}`;
      }

      function getDayLabelFromKey(key) {
        if (key === "unknown") return "Unknown day";
        const [y, m, d] = key.split("-");
        return `${MONTH_NAMES[parseInt(m,10)-1] || "Unknown"} ${parseInt(d,10)}`;
      }

      function buildStructureFromNotes(noteArray) {
        const structure = {};
        noteArray.forEach(note => {
          const d = new Date(note.createdAt);
          const monthKey = getMonthKey(d);
          const dayKey = getDayKey(d);
          if (!structure[monthKey]) structure[monthKey] = {};
          if (!structure[monthKey][dayKey]) structure[monthKey][dayKey] = [];
          structure[monthKey][dayKey].push(note);
        });
        return structure;
      }

      function localYMDFromDate(d) {
        return { y: d.getFullYear(), m: d.getMonth()+1, d: d.getDate() };
      }

      function parseYMString(yyyy_mm) {
        const [y, m] = (yyyy_mm || "").split("-").map(n => parseInt(n, 10));
        if (!y || !m) return null;
        return { y, m };
      }

      function getNotesForMonth(ymStr) {
        const target = parseYMString(ymStr);
        if (!target) return [];
        return notes.filter(n => {
          const nd = new Date(n.createdAt);
          if (isNaN(nd.getTime())) return false;
          const c = localYMDFromDate(nd);
          return c.y === target.y && c.m === target.m;
        });
      }

      function buildTxtFromNotes(noteList, { title }) {
        if (!noteList.length) return "";
        const structure = buildStructureFromNotes(noteList);
        const lines = [];
        lines.push(`SLIPBOX EXPORT — ${title}`);
        lines.push(`Generated: ${formatGeneratedStamp()}`);
        lines.push("");
        const monthKeys = Object.keys(structure).sort((a,b) => b.localeCompare(a));
        monthKeys.forEach((monthKey, mi) => {
          lines.push(getMonthLabelFromKey(monthKey).toUpperCase());
          const dayKeys = Object.keys(structure[monthKey]).sort((a,b) => b.localeCompare(a));
          dayKeys.forEach(dayKey => {
            lines.push(`— ${getDayLabelFromKey(dayKey)} —`);
            const dayNotes = structure[monthKey][dayKey].slice().sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
            dayNotes.forEach(note => {
              lines.push(`[${formatTime(note.createdAt)}] ${note.text}`);
              lines.push("");
            });
          });
          if (mi !== monthKeys.length-1) lines.push("");
        });
        return lines.join("\n").replace(/\n{3,}/g, "\n\n");
      }

      function buildRankedTxt(noteList) {
        if (!noteList.length) return "";
        const lines = [];
        lines.push("SLIPBOX RANKED EXPORT");
        lines.push(`Generated: ${formatGeneratedStamp()}`);
        lines.push("");
        for (let score = 10; score >= 1; score--) {
          const sectionNotes = noteList.filter(note => note.relevanceScore === score);
          if (!sectionNotes.length) continue;
          lines.push(`RELEVANCE ${score}`);
          lines.push("");
          sectionNotes.slice().sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt))
            .forEach((note, index) => {
              lines.push(`${index+1}. ${note.text}`);
              lines.push(`   ${formatDateTime(note.createdAt)}`);
              lines.push("");
            });
        }
        return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
      }

      function exportAllTxt() {
        if (!notes.length) return { ok: false, msg: "No notes to export." };
        const txt = buildTxtFromNotes(notes.slice(), { title: "ALL NOTES" });
        downloadTextFile(`slipbox_all_export_${safeFileStamp()}.txt`, txt);
        return { ok: true };
      }

      function exportRankedTxt() {
        const rated = getRatedNotesSorted();
        if (!rated.length) return { ok: false, msg: "No ranked notes yet." };
        const txt = buildRankedTxt(rated);
        downloadTextFile(`slipbox_ranked_export_${safeFileStamp()}.txt`, txt);
        return { ok: true };
      }

      function exportMonthTxt(ymStr) {
        const list = getNotesForMonth(ymStr).slice().sort((a,b) => new Date(a.createdAt)-new Date(b.createdAt));
        if (!list.length) return { ok: false, msg: "No notes found for that month." };
        const target = parseYMString(ymStr);
        const monthName = MONTH_NAMES[(target?.m||1)-1] || "Unknown";
        const title = `MONTH: ${monthName} ${target?.y||""}`.trim();
        const lines = [];
        lines.push(`SLIPBOX EXPORT — ${title}`);
        lines.push(`Generated: ${formatGeneratedStamp()}`);
        lines.push("");
        const byDay = {};
        list.forEach(n => {
          const key = getDayKey(new Date(n.createdAt));
          if (!byDay[key]) byDay[key] = [];
          byDay[key].push(n);
        });
        Object.keys(byDay).sort((a,b) => a.localeCompare(b)).forEach(dayKey => {
          lines.push(`— ${getDayLabelFromKey(dayKey)} —`);
          byDay[dayKey].slice().sort((a,b) => new Date(a.createdAt)-new Date(b.createdAt)).forEach(note => {
            lines.push(`[${formatTime(note.createdAt)}] ${note.text}`);
            lines.push("");
          });
          lines.push("");
        });
        const txt = lines.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
        downloadTextFile(`slipbox_month_${ymStr}_export_${safeFileStamp()}.txt`, txt);
        return { ok: true };
      }

      function parseCSV(text) {
        const rows = [];
        let row = [], cell = "", inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i], next = text[i+1];
          if (ch==='"' && inQuotes && next==='"') { cell+='"'; i++; continue; }
          if (ch==='"') { inQuotes=!inQuotes; continue; }
          if (ch==="," && !inQuotes) { row.push(cell); cell=""; continue; }
          if ((ch==="\n"||ch==="\r") && !inQuotes) {
            if (ch==="\r"&&next==="\n") i++;
            row.push(cell); rows.push(row); row=[]; cell=""; continue;
          }
          cell+=ch;
        }
        if (cell.length>0||row.length>0) { row.push(cell); rows.push(row); }
        if (rows.length&&rows[0].length&&typeof rows[0][0]==="string") rows[0][0]=rows[0][0].replace(/^\uFEFF/,"");
        return rows;
      }

      function monthNameToIndex(shortName) {
        const m=(shortName||"").trim().toLowerCase().slice(0,3);
        const map={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
        return (m in map)?map[m]:null;
      }

      function parseCsvTimestampToISO(tsRaw) {
        const s=String(tsRaw||"").trim();
        if (!s) return null;
        const m=s.match(/^(?:[A-Za-z]{3},\s*)?([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
        if (!m) return null;
        const mon=monthNameToIndex(m[1]), day=parseInt(m[2],10);
        let hour=parseInt(m[3],10);
        const minute=parseInt(m[4],10), ampm=String(m[5]||"").toUpperCase();
        if (mon===null||!day||isNaN(hour)||isNaN(minute)) return null;
        if (ampm==="PM"&&hour<12) hour+=12;
        if (ampm==="AM"&&hour===12) hour=0;
        const d=new Date(2025,mon,day,hour,minute,0);
        if (isNaN(d.getTime())) return null;
        return d.toISOString();
      }

      async function importCsvFile(file) {
        const text = await file.text();
        const rows = parseCSV(text).filter(r => r.some(cell => String(cell||"").trim()!==""));
        if (!rows.length) return { ok: false, msg: "CSV looks empty." };
        let imported=0, skipped=0;
        const existing=new Set(notes.map(n=>`${n.createdAt}::${n.text}`));
        const firstRowLower=rows[0].map(c=>String(c||"").trim().toLowerCase());
        const looksLikeHeader=firstRowLower.some(h=>["timestamp","time","date","note","text","content"].includes(h));
        let startIndex=0, tsIdx=0, noteIdx=1;
        if (looksLikeHeader) {
          startIndex=1;
          tsIdx=firstRowLower.indexOf("timestamp")!==-1?firstRowLower.indexOf("timestamp"):firstRowLower.indexOf("time")!==-1?firstRowLower.indexOf("time"):firstRowLower.indexOf("date")!==-1?firstRowLower.indexOf("date"):0;
          noteIdx=firstRowLower.indexOf("note")!==-1?firstRowLower.indexOf("note"):firstRowLower.indexOf("text")!==-1?firstRowLower.indexOf("text"):firstRowLower.indexOf("content")!==-1?firstRowLower.indexOf("content"):1;
        }
        for (let i=startIndex; i<rows.length; i++) {
          const r=rows[i];
          const textVal=String(r[noteIdx]??"").trim();
          const iso=parseCsvTimestampToISO(r[tsIdx]??"");
          if (!textVal||!iso) { skipped++; continue; }
          const key=`${iso}::${textVal}`;
          if (existing.has(key)) { skipped++; continue; }
          notes.push({ id:Date.now()+Math.random(), text:textVal, createdAt:iso, relevanceScore:null });
          existing.add(key);
          imported++;
        }
        notes.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
        saveNotes();
        return { ok:true, imported, skipped };
      }

      function showToast(msg) {
        const t=document.getElementById("errorToast");
        t.textContent=msg; t.classList.add("show");
        setTimeout(()=>t.classList.remove("show"),2800);
      }

      function setHint(id, msg) {
        const el=document.getElementById(id);
        if (el) el.textContent=msg||"";
      }

      function refreshCounts() {
        const total=notes.length;
        const rated=getRatedNotes().length;
        const unrated=total-rated;
        document.getElementById("noteCountBadge").textContent=`${total} note${total!==1?"s":""}`;
        setHint("exportHint", total?`${total} total · ${rated} ranked · ${unrated} unrated`:"No notes yet");
      }

      function renderNotes(filterValue="") {
        const listEl=document.getElementById("notesList");
        const query=filterValue.toLowerCase().trim();
        const filtered=query?notes.filter(n=>(n.text||"").toLowerCase().includes(query)):notes;
        listEl.innerHTML="";

        if (!filtered.length) {
          const empty=document.createElement("div");
          empty.className="empty-state";
          empty.innerHTML=`<p>${query?"No notes match your search.":"No notes yet. Add your first one on the left."}</p>`;
          listEl.appendChild(empty);
          return;
        }

        const structure=buildStructureFromNotes(filtered);
        const monthKeys=Object.keys(structure).sort((a,b)=>b.localeCompare(a));

        monthKeys.forEach(monthKey=>{
          const monthDays=structure[monthKey];
          const monthDetails=document.createElement("details");
          monthDetails.className="month-block";
          monthDetails.open=true;

          const monthSummary=document.createElement("summary");
          monthSummary.className="month-summary";
          const monthCount=Object.values(monthDays).reduce((acc,arr)=>acc+arr.length,0);
          monthSummary.innerHTML=
            `<span class="month-summary-title">${getMonthLabelFromKey(monthKey)}</span>`+
            `<span class="month-summary-count">${monthCount} note${monthCount!==1?"s":""}</span>`;
          monthDetails.appendChild(monthSummary);

          const monthInner=document.createElement("div");
          monthInner.className="month-inner";

          Object.keys(monthDays).sort((a,b)=>b.localeCompare(a)).forEach(dayKey=>{
            const dayNotes=monthDays[dayKey];
            const dayDetails=document.createElement("details");
            dayDetails.className="day-block";
            dayDetails.open=true;

            const daySummary=document.createElement("summary");
            daySummary.className="day-summary";
            daySummary.innerHTML=
              `<span class="day-summary-title">${getDayLabelFromKey(dayKey)}</span>`+
              `<span class="day-summary-count">${dayNotes.length} note${dayNotes.length!==1?"s":""}</span>`;
            dayDetails.appendChild(daySummary);

            const dayInner=document.createElement("div");
            dayInner.className="day-inner";

            dayNotes.slice().sort((a,b)=>{
              if ((b.relevanceScore||0)!==(a.relevanceScore||0)) return (b.relevanceScore||0)-(a.relevanceScore||0);
              return new Date(b.createdAt).getTime()-new Date(a.createdAt).getTime();
            }).forEach(note=>{
              const card=document.createElement("article");
              card.className="note";

              const headerRow=document.createElement("div");
              headerRow.className="note-header-row";

              const leftWrap=document.createElement("div");
              leftWrap.className="note-meta-wrap";

              const meta=document.createElement("div");
              meta.className="note-meta";
              meta.textContent=formatTime(note.createdAt);

              const score=document.createElement("span");
              score.className="score-badge"+(Number.isInteger(note.relevanceScore)?" rated":"");
              score.textContent=Number.isInteger(note.relevanceScore)?`R${note.relevanceScore}`:"unrated";

              leftWrap.appendChild(meta);
              leftWrap.appendChild(score);

              const delBtn=document.createElement("button");
              delBtn.className="delete-note-btn";
              delBtn.type="button";
              delBtn.textContent="×";
              delBtn.title="Delete note";
              delBtn.addEventListener("click",()=>{
                if (!confirm("Delete this note? This can't be undone.")) return;
                deleteNote(note.id);
                renderNotes(document.getElementById("searchInput").value);
                refreshCounts();
              });

              headerRow.appendChild(leftWrap);
              headerRow.appendChild(delBtn);

              const text=document.createElement("p");
              text.className="note-text";
              text.textContent=note.text;

              card.appendChild(headerRow);
              card.appendChild(text);
              dayInner.appendChild(card);
            });

            dayDetails.appendChild(dayInner);
            monthInner.appendChild(dayDetails);
          });

          monthDetails.appendChild(monthInner);
          listEl.appendChild(monthDetails);
        });
      }

      function setupCollapsibles() {
        [
          ["newNoteHeader","newNoteBody"],
          ["pastNoteHeader","pastNoteBody"],
          ["exportHeader","exportBody"]
        ].forEach(([headerId, bodyId])=>{
          const header=document.getElementById(headerId);
          const body=document.getElementById(bodyId);
          header.addEventListener("click",()=>{
            const isCollapsed=header.classList.contains("collapsed");
            if (isCollapsed) {
              header.classList.remove("collapsed");
              body.classList.remove("hidden");
            } else {
              header.classList.add("collapsed");
              body.classList.add("hidden");
            }
          });
        });
      }

      function setup() {
        setupCollapsibles();

        const noteInput=document.getElementById("noteInput");
        const saveButton=document.getElementById("saveButton");
        const searchInput=document.getElementById("searchInput");
        const pastNoteInput=document.getElementById("pastNoteInput");
        const pastNoteTimeInput=document.getElementById("pastNoteTime");
        const savePastButton=document.getElementById("savePastButton");

        saveButton.addEventListener("click",()=>{
          const text=noteInput.value.trim();
          if (!text) return;
          createNote(text);
          noteInput.value="";
          renderNotes(searchInput.value);
          refreshCounts();
        });

        noteInput.addEventListener("keydown",event=>{
          if ((event.ctrlKey||event.metaKey)&&event.key==="Enter") {
            event.preventDefault();
            saveButton.click();
          }
        });

        savePastButton.addEventListener("click",()=>{
          const text=pastNoteInput.value.trim();
          const timestamp=(pastNoteTimeInput.value||"").trim();
          if (!text) return;
          if (!timestamp) { alert("Set a timestamp for the past note."); return; }
          createNote(text,timestamp);
          pastNoteInput.value="";
          pastNoteTimeInput.value="";
          renderNotes(searchInput.value);
          refreshCounts();
        });

        searchInput.addEventListener("input",()=>{
          renderNotes(searchInput.value);
        });

        document.getElementById("exportRankedTxtBtn").addEventListener("click",()=>{
          const res=exportRankedTxt();
          if (!res.ok) showToast(res.msg);
        });

        document.getElementById("exportAllBtn").addEventListener("click",()=>{
          const res=exportAllTxt();
          if (!res.ok) showToast(res.msg);
        });

        document.getElementById("exportMonthBtn").addEventListener("click",()=>{
          const ym=(document.getElementById("exportMonthOnlyInput").value||"").trim();
          if (!ym) { showToast("Choose a month first."); return; }
          const res=exportMonthTxt(ym);
          if (!res.ok) showToast(res.msg);
        });

        document.getElementById("importCsvBtn").addEventListener("click",async()=>{
          const file=document.getElementById("csvInput").files?.[0];
          if (!file) { showToast("Choose a CSV file first."); return; }
          setHint("importHint","Importing…");
          try {
            const res=await importCsvFile(file);
            if (!res.ok) { setHint("importHint",""); showToast(res.msg||"Import failed."); return; }
            renderNotes(searchInput.value);
            refreshCounts();
            setHint("importHint",`Imported ${res.imported}. Skipped ${res.skipped}.`);
          } catch(e) {
            console.error(e);
            setHint("importHint","");
            showToast("Import failed. Open DevTools → Console for details.");
          }
        });

        loadNotes();
        saveNotes();
        renderNotes();
        refreshCounts();
      }

      window.addEventListener("DOMContentLoaded", setup);
    })();
  </script>
</body>
