<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slipbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(76, 99, 122, 0.18), transparent 35%),
        linear-gradient(180deg, #0f141a 0%, #111821 100%);
      color: #dbe3ea;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .app {
      max-width: 1100px;
      width: 100%;
      background: rgba(18, 24, 32, 0.96);
      border-radius: 18px;
      padding: 20px 22px 24px;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(112, 130, 148, 0.22);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(103, 120, 136, 0.28);
    }

    .title {
      font-size: 1.4rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      color: #eef4f8;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #8f9eab;
    }

    main.layout {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (min-width: 800px) {
      main.layout {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .panel {
      background: rgba(24, 31, 40, 0.82);
      border-radius: 14px;
      padding: 16px 14px 14px;
      border: 1px solid rgba(70, 84, 97, 0.8);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-left { flex: 1; min-width: 0; }
    .panel-right { flex: 1.1; min-width: 0; }

    .panel h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #8f9eab;
      margin: 0;
    }

    label {
      font-size: 0.85rem;
      color: #c6d1da;
    }

    textarea,
    .search-input,
    .export-row input,
    .export-row select,
    #pastNoteTime {
      width: 100%;
      resize: vertical;
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid rgba(74, 89, 103, 0.9);
      background: #0d1218;
      color: #e5edf3;
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.4;
      outline: none;
    }

    textarea:focus,
    .search-input:focus,
    .export-row input:focus,
    .export-row select:focus,
    #pastNoteTime:focus {
      border-color: #6f8ea8;
      box-shadow: 0 0 0 1px rgba(111, 142, 168, 0.5);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      background: linear-gradient(135deg, #5f7488, #7c94aa);
      color: white;
      cursor: pointer;
      transition: transform 0.06s ease, box-shadow 0.06s ease, opacity 0.08s;
      box-shadow: 0 8px 18px rgba(70, 90, 109, 0.35);
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(70, 90, 109, 0.45);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 5px 14px rgba(70, 90, 109, 0.32);
      opacity: 0.95;
    }

    button.secondary {
      background: #121920;
      border: 1px solid rgba(74, 89, 103, 0.9);
      box-shadow: none;
      color: #d7e0e8;
    }

    button.secondary:hover {
      transform: translateY(-1px);
      box-shadow: none;
      border-color: rgba(111, 142, 168, 0.8);
    }

    button.secondary:active {
      transform: translateY(0);
      opacity: 0.95;
    }

    button.danger {
      background: #121920;
      border: 1px solid rgba(186, 95, 95, 0.7);
      box-shadow: none;
      color: #f1c1c1;
    }

    button.danger:hover {
      transform: translateY(-1px);
      box-shadow: none;
      border-color: rgba(186, 95, 95, 1);
    }

    button.danger:active {
      transform: translateY(0);
      opacity: 0.95;
    }

    .hint {
      font-size: 0.75rem;
      color: #8f9eab;
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 0.75rem;
      background: rgba(22, 29, 37, 0.95);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(80, 95, 108, 0.75);
      color: #d9e2e9;
    }

    .search-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-input {
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .notes-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .export-block {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .export-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .export-row input,
    .export-row select {
      flex: 1;
      min-width: 180px;
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    details.month-block {
      border-radius: 10px;
      border: 1px solid rgba(53, 65, 76, 0.85);
      background: rgba(19, 25, 33, 0.9);
      padding: 4px 8px 6px;
    }

    details.month-block + details.month-block { margin-top: 6px; }

    summary.month-summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #95a4b1;
    }

    summary.month-summary::-webkit-details-marker { display: none; }

    .month-summary-title::before {
      content: "▸";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.12s ease;
      font-size: 0.7rem;
    }

    details[open] > summary .month-summary-title::before {
      transform: rotate(90deg);
    }

    .month-summary-count {
      font-size: 0.75rem;
      color: #72808c;
    }

    .month-inner {
      margin-top: 4px;
      padding-left: 4px;
      border-left: 1px solid rgba(57, 69, 80, 0.7);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    details.day-block {
      border-radius: 6px;
      padding: 2px 4px 4px;
      background: transparent;
    }

    summary.day-summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.8rem;
      color: #d0dbe4;
    }

    summary.day-summary::-webkit-details-marker { display: none; }

    .day-summary-title::before {
      content: "▸";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.12s ease;
      font-size: 0.7rem;
    }

    details.day-block[open] > summary .day-summary-title::before {
      transform: rotate(90deg);
    }

    .day-summary-count {
      font-size: 0.75rem;
      color: #8f9eab;
    }

    .day-inner {
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .note {
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(17, 23, 30, 0.94);
      border: 1px solid rgba(67, 81, 94, 0.85);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .note-meta {
      font-size: 0.75rem;
      color: #8f9eab;
    }

    .delete-note-btn {
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .note-text {
      margin: 0;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #e6edf3;
    }

    .empty {
      font-size: 0.8rem;
      color: #72808c;
      padding: 12px 4px;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <div class="title">Slipbox</div>
        <div class="subtitle">A minimal inbox for your notes</div>
      </div>
      <div class="subtitle">Stored locally · No account · No sync (yet)</div>
    </header>

    <main class="layout">
      <section class="panel panel-left">
        <h2>New note</h2>

        <label for="noteInput">Note</label>
        <textarea id="noteInput" placeholder="Type anything you’d normally email yourself..."></textarea>

        <div class="controls">
          <button id="saveButton">Save note</button>
          <div class="hint">
            Shortcut:
            <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span>
            /
            <span class="kbd">⌘</span> + <span class="kbd">Enter</span>
          </div>
        </div>

        <hr style="margin: 14px 0; border: none; border-top: 1px solid rgba(74, 89, 103, 0.7);" />

        <h2 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.07em; color: #8f9eab; margin: 0 0 4px;">
          Add past note
        </h2>

        <label for="pastNoteInput">Note</label>
        <textarea id="pastNoteInput" placeholder="Paste an old note here..."></textarea>

        <label for="pastNoteTime" style="margin-top: 6px;">Timestamp (past)</label>
        <input id="pastNoteTime" type="datetime-local" />

        <div class="controls" style="margin-top: 6px;">
          <button id="savePastButton">Save past note</button>
        </div>
      </section>

      <section class="panel panel-right">
        <h2>Notes</h2>

        <div class="search-row">
          <label for="searchInput">Search</label>
          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Search notes..."
          />
        </div>

        <div class="export-block" aria-label="Export notes">
          <div class="export-row">
            <button id="exportAllBtn" class="secondary">Export all .txt</button>
          </div>

          <div class="export-row">
            <input id="exportDayInput" type="date" />
            <button id="exportDayBtn" class="secondary">Export day .txt</button>
          </div>

          <div class="export-row">
            <input id="exportMonthOnlyInput" type="month" />
            <button id="exportMonthBtn" class="secondary">Export month .txt</button>
          </div>

          <div class="export-row">
            <input id="exportMonthInput" type="month" />
            <select id="exportWeekSelect">
              <option value="1">Week 1 (1–7)</option>
              <option value="2">Week 2 (8–14)</option>
              <option value="3">Week 3 (15–21)</option>
              <option value="4">Week 4 (22–28)</option>
              <option value="5">Week 5 (29–end)</option>
            </select>
            <button id="exportWeekBtn" class="secondary">Export week .txt</button>
          </div>

          <div class="export-row">
            <input id="csvInput" type="file" accept=".csv,text/csv" />
            <button id="importCsvBtn" class="secondary">Import CSV</button>
          </div>

          <div id="exportHint" class="hint"></div>
          <div id="importHint" class="hint"></div>
        </div>

        <div id="notesList" class="notes-list"></div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "slipboxNotes";
      const IMPORT_YEAR = 2025;
      let notes = [];

      const MONTH_NAMES = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
      ];

      function loadNotes() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          notes = [];
          return;
        }

        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            notes = parsed.map(n => ({
              id: n.id,
              text: n.text || "",
              createdAt: n.createdAt || new Date().toISOString()
            }));
          } else {
            notes = [];
          }
        } catch (err) {
          console.error("Failed to parse notes from localStorage", err);
          notes = [];
        }
      }

      function saveNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      function createNote(text, createdAtISO) {
        const baseText = (text || "").trim();
        if (!baseText) return;

        let createdDate;
        if (createdAtISO) {
          const parsed = new Date(createdAtISO);
          createdDate = isNaN(parsed.getTime()) ? new Date() : parsed;
        } else {
          createdDate = new Date();
        }

        const note = {
          id: Date.now() + Math.random(),
          text: baseText,
          createdAt: createdDate.toISOString()
        };

        notes.unshift(note);
        saveNotes();
      }

      function deleteNote(noteId) {
        const idx = notes.findIndex(n => String(n.id) === String(noteId));
        if (idx === -1) return;
        notes.splice(idx, 1);
        saveNotes();
      }

      function formatTime(isoString) {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      }

      function formatGeneratedStamp() {
        const d = new Date();
        const date = d.toLocaleDateString(undefined, { year: "numeric", month: "2-digit", day: "2-digit" });
        const time = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
        return `${date} ${time}`;
      }

      function safeFileStamp() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function downloadTextFile(filename, text) {
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function getMonthKey(d) {
        if (!(d instanceof Date) || isNaN(d.getTime())) return "unknown";
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        return `${y}-${m}`;
      }

      function getDayKey(d) {
        if (!(d instanceof Date) || isNaN(d.getTime())) return "unknown";
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function getMonthLabelFromKey(key) {
        if (key === "unknown") return "Unknown";
        const [y, m] = key.split("-");
        const idx = parseInt(m, 10) - 1;
        const name = MONTH_NAMES[idx] || "Unknown";
        return `${name} ${y}`;
      }

      function getDayLabelFromKey(key) {
        if (key === "unknown") return "Unknown day";
        const [y, m, d] = key.split("-");
        const idx = parseInt(m, 10) - 1;
        const monthName = MONTH_NAMES[idx] || "Unknown";
        return `${monthName} ${parseInt(d, 10)}`;
      }

      function buildStructureFromNotes(noteArray) {
        const structure = {};
        noteArray.forEach(note => {
          const d = new Date(note.createdAt);
          const monthKey = getMonthKey(d);
          const dayKey = getDayKey(d);

          if (!structure[monthKey]) structure[monthKey] = {};
          if (!structure[monthKey][dayKey]) structure[monthKey][dayKey] = [];
          structure[monthKey][dayKey].push(note);
        });
        return structure;
      }

      function localYMDFromDate(d) {
        return { y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate() };
      }

      function parseYMDString(yyyy_mm_dd) {
        const [y, m, d] = (yyyy_mm_dd || "").split("-").map(n => parseInt(n, 10));
        if (!y || !m || !d) return null;
        return { y, m, d };
      }

      function parseYMString(yyyy_mm) {
        const [y, m] = (yyyy_mm || "").split("-").map(n => parseInt(n, 10));
        if (!y || !m) return null;
        return { y, m };
      }

      function daysInMonth(year, month1to12) {
        return new Date(year, month1to12, 0).getDate();
      }

      function getNotesForDay(dateStr) {
        const target = parseYMDString(dateStr);
        if (!target) return [];
        return notes.filter(n => {
          const nd = new Date(n.createdAt);
          if (isNaN(nd.getTime())) return false;
          const c = localYMDFromDate(nd);
          return c.y === target.y && c.m === target.m && c.d === target.d;
        });
      }

      function getNotesForMonth(ymStr) {
        const target = parseYMString(ymStr);
        if (!target) return [];
        return notes.filter(n => {
          const nd = new Date(n.createdAt);
          if (isNaN(nd.getTime())) return false;
          const c = localYMDFromDate(nd);
          return c.y === target.y && c.m === target.m;
        });
      }

      function getWeekRange(year, month1to12, weekNumber) {
        const last = daysInMonth(year, month1to12);
        const w = Math.min(Math.max(parseInt(weekNumber, 10) || 1, 1), 5);
        const start = (w - 1) * 7 + 1;
        const end = (w === 5) ? last : Math.min(w * 7, last);
        return { startDay: start, endDay: end, lastDay: last };
      }

      function getNotesForWeekOfMonth(ymStr, weekNumber) {
        const target = parseYMString(ymStr);
        if (!target) return { list: [], range: null, target: null };
        const range = getWeekRange(target.y, target.m, weekNumber);

        const list = notes.filter(n => {
          const nd = new Date(n.createdAt);
          if (isNaN(nd.getTime())) return false;
          const c = localYMDFromDate(nd);
          return c.y === target.y && c.m === target.m && c.d >= range.startDay && c.d <= range.endDay;
        });

        return { list, range, target };
      }

      function buildTxtFromNotes(noteList, { title }) {
        if (!noteList.length) return "";

        const structure = buildStructureFromNotes(noteList);
        const lines = [];
        lines.push(`SLIPBOX EXPORT — ${title}`);
        lines.push(`Generated: ${formatGeneratedStamp()}`);
        lines.push("");

        const monthKeys = Object.keys(structure).sort((a, b) => b.localeCompare(a));
        monthKeys.forEach((monthKey, mi) => {
          lines.push(getMonthLabelFromKey(monthKey).toUpperCase());

          const dayKeys = Object.keys(structure[monthKey]).sort((a, b) => b.localeCompare(a));
          dayKeys.forEach(dayKey => {
            lines.push(`— ${getDayLabelFromKey(dayKey)} —`);

            const dayNotes = structure[monthKey][dayKey].slice().sort((a, b) => {
              return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
            });

            dayNotes.forEach(note => {
              const time = formatTime(note.createdAt);
              lines.push(`[${time}] ${note.text}`);
              lines.push("");
            });
          });

          if (mi !== monthKeys.length - 1) lines.push("");
        });

        return lines.join("\n").replace(/\n{3,}/g, "\n\n");
      }

      function exportAllTxt() {
        if (!notes.length) return { ok: false, msg: "No notes to export." };
        const txt = buildTxtFromNotes(notes.slice(), { title: "ALL NOTES" });
        downloadTextFile(`slipbox_all_export_${safeFileStamp()}.txt`, txt);
        return { ok: true };
      }

      function exportDayTxt(dateStr) {
        const list = getNotesForDay(dateStr).slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        if (!list.length) return { ok: false, msg: "No notes found for that day." };
        const txt = buildTxtFromNotes(list, { title: `DAY: ${dateStr}` });
        downloadTextFile(`slipbox_day_${dateStr}_export_${safeFileStamp()}.txt`, txt);
        return { ok: true };
      }

      function exportMonthTxt(ymStr) {
        const list = getNotesForMonth(ymStr).slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        if (!list.length) return { ok: false, msg: "No notes found for that month." };

        const target = parseYMString(ymStr);
        const monthName = MONTH_NAMES[(target?.m || 1) - 1] || "Unknown";
        const title = `MONTH: ${monthName} ${target?.y || ""}`.trim();

        const lines = [];
        lines.push(`SLIPBOX EXPORT — ${title}`);
        lines.push(`Generated: ${formatGeneratedStamp()}`);
        lines.push("");

        const byDay = {};
        list.forEach(n => {
          const d = new Date(n.createdAt);
          const key = getDayKey(d);
          if (!byDay[key]) byDay[key] = [];
          byDay[key].push(n);
        });

        const dayKeys = Object.keys(byDay).sort((a, b) => a.localeCompare(b));
        dayKeys.forEach(dayKey => {
          lines.push(`— ${getDayLabelFromKey(dayKey)} —`);
          const dayNotes = byDay[dayKey].slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
          dayNotes.forEach(note => {
            const time = formatTime(note.createdAt);
            lines.push(`[${time}] ${note.text}`);
            lines.push("");
          });
          lines.push("");
        });

        const txt = lines.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
        downloadTextFile(`slipbox_month_${ymStr}_export_${safeFileStamp()}.txt`, txt);
        return { ok: true };
      }

      function exportWeekTxt(ymStr, weekNumber) {
        const { list, range, target } = getNotesForWeekOfMonth(ymStr, weekNumber);
        if (!target) return { ok: false, msg: "Invalid month. Use the month picker or enter YYYY-MM." };

        const sorted = list.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        if (!sorted.length) return { ok: false, msg: "No notes found for that week." };

        const monthName = MONTH_NAMES[target.m - 1] || "Unknown";
        const title = `WEEK: ${monthName} ${target.y} — Week ${weekNumber} (${range.startDay}–${range.endDay})`;
        const txt = buildTxtFromNotes(sorted, { title });

        downloadTextFile(`slipbox_week_${ymStr}_w${weekNumber}_export_${safeFileStamp()}.txt`, txt);
        return { ok: true };
      }

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let cell = "";
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          const next = text[i + 1];

          if (ch === '"' && inQuotes && next === '"') {
            cell += '"';
            i++;
            continue;
          }

          if (ch === '"') {
            inQuotes = !inQuotes;
            continue;
          }

          if (ch === "," && !inQuotes) {
            row.push(cell);
            cell = "";
            continue;
          }

          if ((ch === "\n" || ch === "\r") && !inQuotes) {
            if (ch === "\r" && next === "\n") i++;
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
            continue;
          }

          cell += ch;
        }

        if (cell.length > 0 || row.length > 0) {
          row.push(cell);
          rows.push(row);
        }

        if (rows.length && rows[0].length && typeof rows[0][0] === "string") {
          rows[0][0] = rows[0][0].replace(/^\uFEFF/, "");
        }

        return rows;
      }

      function monthNameToIndex(shortName) {
        const m = (shortName || "").trim().toLowerCase().slice(0, 3);
        const map = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
        return (m in map) ? map[m] : null;
      }

      function parseCsvTimestampToISO(tsRaw) {
        const s = String(tsRaw || "").trim();
        if (!s) return null;

        const m = s.match(/^(?:[A-Za-z]{3},\s*)?([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
        if (!m) return null;

        const mon = monthNameToIndex(m[1]);
        const day = parseInt(m[2], 10);
        let hour = parseInt(m[3], 10);
        const minute = parseInt(m[4], 10);
        const ampm = String(m[5] || "").toUpperCase();

        if (mon === null || !day || isNaN(hour) || isNaN(minute)) return null;

        if (ampm === "PM" && hour < 12) hour += 12;
        if (ampm === "AM" && hour === 12) hour = 0;

        const d = new Date(IMPORT_YEAR, mon, day, hour, minute, 0);
        if (isNaN(d.getTime())) return null;
        return d.toISOString();
      }

      async function importCsvFile(file) {
        const text = await file.text();
        const rows = parseCSV(text).filter(r => r.some(cell => String(cell || "").trim() !== ""));

        if (!rows.length) {
          return { ok: false, msg: "CSV looks empty." };
        }

        let imported = 0;
        let skipped = 0;

        const existing = new Set(notes.map(n => `${n.createdAt}::${n.text}`));

        const firstRowLower = rows[0].map(c => String(c || "").trim().toLowerCase());
        const looksLikeHeader = firstRowLower.some(h =>
          ["timestamp","time","date"].includes(h) || ["note","text","content"].includes(h)
        );

        let startIndex = 0;
        let tsIdx = 0;
        let noteIdx = 1;

        if (looksLikeHeader) {
          startIndex = 1;
          tsIdx =
            firstRowLower.indexOf("timestamp") !== -1 ? firstRowLower.indexOf("timestamp")
            : firstRowLower.indexOf("time") !== -1 ? firstRowLower.indexOf("time")
            : firstRowLower.indexOf("date") !== -1 ? firstRowLower.indexOf("date")
            : 0;

          noteIdx =
            firstRowLower.indexOf("note") !== -1 ? firstRowLower.indexOf("note")
            : firstRowLower.indexOf("text") !== -1 ? firstRowLower.indexOf("text")
            : firstRowLower.indexOf("content") !== -1 ? firstRowLower.indexOf("content")
            : 1;
        }

        for (let i = startIndex; i < rows.length; i++) {
          const r = rows[i];
          const tsRaw = r[tsIdx] ?? "";
          const noteRaw = r[noteIdx] ?? "";

          const textVal = String(noteRaw ?? "").trim();
          const iso = parseCsvTimestampToISO(tsRaw);

          if (!textVal || !iso) {
            skipped++;
            continue;
          }

          const key = `${iso}::${textVal}`;
          if (existing.has(key)) {
            skipped++;
            continue;
          }

          notes.push({
            id: Date.now() + Math.random(),
            text: textVal,
            createdAt: iso
          });

          existing.add(key);
          imported++;
        }

        notes.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        saveNotes();

        return { ok: true, imported, skipped };
      }

      function renderNotes(filterValue = "") {
        const listEl = document.getElementById("notesList");
        const query = filterValue.toLowerCase().trim();

        const filtered = query
          ? notes.filter(n => (n.text || "").toLowerCase().includes(query))
          : notes;

        listEl.innerHTML = "";

        if (!filtered.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = query ? "No notes match your search." : "No notes yet. Type on the left and save your first one.";
          listEl.appendChild(empty);
          return;
        }

        const structure = buildStructureFromNotes(filtered);
        const monthKeys = Object.keys(structure).sort((a, b) => b.localeCompare(a));

        monthKeys.forEach(monthKey => {
          const monthDays = structure[monthKey];

          const monthDetails = document.createElement("details");
          monthDetails.className = "month-block";
          monthDetails.open = true;

          const monthSummary = document.createElement("summary");
          monthSummary.className = "month-summary";

          const titleSpan = document.createElement("span");
          titleSpan.className = "month-summary-title";
          titleSpan.textContent = getMonthLabelFromKey(monthKey);

          const countSpan = document.createElement("span");
          countSpan.className = "month-summary-count";
          const monthCount = Object.values(monthDays).reduce((acc, arr) => acc + arr.length, 0);
          countSpan.textContent = `${monthCount} note${monthCount !== 1 ? "s" : ""}`;

          monthSummary.appendChild(titleSpan);
          monthSummary.appendChild(countSpan);
          monthDetails.appendChild(monthSummary);

          const monthInner = document.createElement("div");
          monthInner.className = "month-inner";

          const dayKeys = Object.keys(monthDays).sort((a, b) => b.localeCompare(a));
          dayKeys.forEach(dayKey => {
            const dayNotes = monthDays[dayKey];

            const dayDetails = document.createElement("details");
            dayDetails.className = "day-block";
            dayDetails.open = true;

            const daySummary = document.createElement("summary");
            daySummary.className = "day-summary";

            const dayTitle = document.createElement("span");
            dayTitle.className = "day-summary-title";
            dayTitle.textContent = getDayLabelFromKey(dayKey);

            const dayCount = document.createElement("span");
            dayCount.className = "day-summary-count";
            dayCount.textContent = `${dayNotes.length} note${dayNotes.length !== 1 ? "s" : ""}`;

            daySummary.appendChild(dayTitle);
            daySummary.appendChild(dayCount);
            dayDetails.appendChild(daySummary);

            const dayInner = document.createElement("div");
            dayInner.className = "day-inner";

            const sortedDayNotes = dayNotes.slice().sort((a, b) => {
              return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
            });

            sortedDayNotes.forEach(note => {
              const card = document.createElement("article");
              card.className = "note";

              const headerRow = document.createElement("div");
              headerRow.className = "note-header-row";

              const meta = document.createElement("div");
              meta.className = "note-meta";
              meta.textContent = formatTime(note.createdAt);

              const delBtn = document.createElement("button");
              delBtn.className = "danger delete-note-btn";
              delBtn.type = "button";
              delBtn.textContent = "Delete";
              delBtn.addEventListener("click", () => {
                const ok = confirm("Delete this note? This can’t be undone.");
                if (!ok) return;
                deleteNote(note.id);
                renderNotes(document.getElementById("searchInput").value);
                refreshCounts();
              });

              headerRow.appendChild(meta);
              headerRow.appendChild(delBtn);

              const text = document.createElement("p");
              text.className = "note-text";
              text.textContent = note.text;

              card.appendChild(headerRow);
              card.appendChild(text);
              dayInner.appendChild(card);
            });

            dayDetails.appendChild(dayInner);
            monthInner.appendChild(dayDetails);
          });

          monthDetails.appendChild(monthInner);
          listEl.appendChild(monthDetails);
        });
      }

      function setHint(id, msg) {
        const el = document.getElementById(id);
        if (el) el.textContent = msg || "";
      }

      function refreshCounts() {
        setHint("exportHint", notes.length ? `${notes.length} note${notes.length !== 1 ? "s" : ""} total` : "No notes yet");
      }

      function setup() {
        const noteInput = document.getElementById("noteInput");
        const saveButton = document.getElementById("saveButton");
        const searchInput = document.getElementById("searchInput");

        const pastNoteInput = document.getElementById("pastNoteInput");
        const pastNoteTimeInput = document.getElementById("pastNoteTime");
        const savePastButton = document.getElementById("savePastButton");

        const exportAllBtn = document.getElementById("exportAllBtn");
        const exportDayInput = document.getElementById("exportDayInput");
        const exportDayBtn = document.getElementById("exportDayBtn");
        const exportMonthOnlyInput = document.getElementById("exportMonthOnlyInput");
        const exportMonthBtn = document.getElementById("exportMonthBtn");
        const exportMonthInput = document.getElementById("exportMonthInput");
        const exportWeekSelect = document.getElementById("exportWeekSelect");
        const exportWeekBtn = document.getElementById("exportWeekBtn");

        const csvInput = document.getElementById("csvInput");
        const importCsvBtn = document.getElementById("importCsvBtn");

        saveButton.addEventListener("click", () => {
          const text = noteInput.value.trim();
          if (!text) return;
          createNote(text);
          noteInput.value = "";
          renderNotes(searchInput.value);
          refreshCounts();
        });

        noteInput.addEventListener("keydown", event => {
          if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
            event.preventDefault();
            saveButton.click();
          }
        });

        savePastButton.addEventListener("click", () => {
          const text = pastNoteInput.value.trim();
          const timestamp = (pastNoteTimeInput.value || "").trim();
          if (!text) return;
          if (!timestamp) {
            alert("Set a timestamp for the past note.");
            return;
          }

          createNote(text, timestamp);
          pastNoteInput.value = "";
          renderNotes(searchInput.value);
          refreshCounts();
        });

        searchInput.addEventListener("input", () => {
          renderNotes(searchInput.value);
        });

        exportAllBtn.addEventListener("click", () => {
          const res = exportAllTxt();
          if (!res.ok) alert(res.msg);
        });

        exportDayBtn.addEventListener("click", () => {
          const val = (exportDayInput.value || "").trim();
          if (!val) {
            alert("Choose a day first.");
            return;
          }
          const res = exportDayTxt(val);
          if (!res.ok) alert(res.msg);
        });

        exportMonthBtn.addEventListener("click", () => {
          const ym = (exportMonthOnlyInput.value || "").trim();
          if (!ym) {
            alert("Choose a month first.");
            return;
          }
          const res = exportMonthTxt(ym);
          if (!res.ok) alert(res.msg);
        });

        exportWeekBtn.addEventListener("click", () => {
          const ym = (exportMonthInput.value || "").trim();
          const w = (exportWeekSelect.value || "1").trim();
          if (!ym) {
            alert("Choose a month first.");
            return;
          }
          const res = exportWeekTxt(ym, w);
          if (!res.ok) alert(res.msg);
        });

        importCsvBtn.addEventListener("click", async () => {
          const file = csvInput.files && csvInput.files[0];
          if (!file) {
            alert("Choose a CSV file first.");
            return;
          }

          setHint("importHint", "Importing…");
          try {
            const res = await importCsvFile(file);
            if (!res.ok) {
              setHint("importHint", "");
              alert(res.msg || "Import failed.");
              return;
            }
            renderNotes(searchInput.value);
            refreshCounts();
            setHint("importHint", `Imported ${res.imported}. Skipped ${res.skipped}.`);
          } catch (e) {
            console.error(e);
            setHint("importHint", "");
            alert("Import failed. Open DevTools → Console for details.");
          }
        });

        loadNotes();
        saveNotes();
        renderNotes();
        refreshCounts();
      }

      window.addEventListener("DOMContentLoaded", setup);
    })();
  </script>
</body>
</html>
